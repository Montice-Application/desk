name: Desk Windows verification
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to verify
        required: true
        default: v0.4.0
        type: string
      sha256:
        description: Expected SHA-256 of MonticeDesk.exe
        required: true
        type: string
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Download and verify the prepared executable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_SHA256: ${{ inputs.sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') { throw 'Invalid release tag.' }
          if ($env:EXPECTED_SHA256 -notmatch '^[a-fA-F0-9]{64}$') { throw 'Invalid SHA-256.' }
          $folder = Join-Path $env:RUNNER_TEMP 'montice-desk-check'
          New-Item -ItemType Directory -Force $folder | Out-Null
          $exe = Join-Path $folder 'MonticeDesk.exe'
          # Der Tag-Endpunkt liefert nur veroeffentlichte Releases. Ein Entwurf
          # benoetigt zusaetzlich Push-Zugriff; Rechte nicht stillschweigend erweitern.
          $releasesJson = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Release lookup failed.' }
          $release = @($releasesJson | ConvertFrom-Json) | Where-Object tag_name -eq $env:RELEASE_TAG
          if (@($release).Count -ne 1) { throw 'The prepared release was not found.' }
          $asset = @($release.assets) | Where-Object name -eq 'MonticeDesk.exe'
          if (@($asset).Count -ne 1) { throw 'The executable asset was not found.' }
          if ($PSVersionTable.PSVersion -lt [version]'7.4') { throw 'Binary redirection requires PowerShell 7.4 or newer.' }
          gh api -H 'Accept: application/octet-stream' "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)" > $exe
          if ($LASTEXITCODE -ne 0) { throw 'Release download failed.' }
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $exe).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256.ToLowerInvariant()) { throw 'Executable SHA-256 does not match.' }
          Write-Output "Verified executable SHA-256: $actual"
      - name: Verify native Schannel TLS and protected identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $folder = Join-Path $env:RUNNER_TEMP 'montice-desk-check'
          $exe = Join-Path $folder 'MonticeDesk.exe'
          $report = Join-Path $folder 'tls-report.json'
          $process = Start-Process -FilePath $exe -ArgumentList @('--verify-tls', ('"' + $report + '"')) -PassThru
          if (-not $process.WaitForExit(60000)) {
            $process.Kill()
            throw 'The isolated verification process timed out.'
          }
          if (Test-Path -LiteralPath $report) { Get-Content -LiteralPath $report }
          if ($process.ExitCode -ne 0) { throw "Native verification failed: $($process.ExitCode)" }
          $result = Get-Content -Raw -LiteralPath $report | ConvertFrom-Json
          if (-not $result.passed) { throw 'The native verification report did not confirm success.' }

      - name: Verify native window layouts and stable timer refresh
        shell: pwsh
        run: |
          $exe = Join-Path $env:RUNNER_TEMP 'montice-desk-check/MonticeDesk.exe'
          $folder = Join-Path $env:RUNNER_TEMP 'montice-desk-ui'
          $process = Start-Process -FilePath $exe -ArgumentList @('--verify-ui', ('"' + $folder + '"')) -PassThru
          if (-not $process.WaitForExit(120000)) {
            $process.Kill()
            throw 'The isolated native UI verification timed out.'
          }
          Get-Content -LiteralPath (Join-Path $folder 'ui-report.json')
          if ($process.ExitCode -ne 0) { throw 'Native UI verification failed.' }
      - name: Preserve fictitious native UI verification images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desk-native-ui
          path: ${{ runner.temp }}/montice-desk-ui/
          if-no-files-found: warn
